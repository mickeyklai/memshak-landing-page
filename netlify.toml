[build]
  command = "npm install && npm run build"
  publish = "."
  functions = "netlify/functions"

[[edge_functions]]
  path = "/blog/*"
  function = "inject-blog-og"

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

[[redirects]]
  from = "/feed.xml"
  to = "/.netlify/functions/feed"
  status = 200

[[redirects]]
  from = "/rss.xml"
  to = "/.netlify/functions/feed"
  status = 200

[[redirects]]
  from = "/api/download/latest"
  to = "/.netlify/functions/latest-download"
  status = 200

[[redirects]]
  from = "/download/latest"
  to = "/.netlify/functions/latest-download?dl=1"
  status = 200

[[redirects]]
  from = "/blog/*"
  to = "/blog/post.html"
  status = 200

# The summary page itself lives only in the memshak backend (unified-remote-service.js
# GET /summary/:token) — these are pure reverse-proxy rules so maliapp.co.il/summary/...
# stays in the address bar while Railway serves the actual content. ?env=staging picks
# the staging backend; anything else (including no query string) goes to production.
[[redirects]]
  from = "/summary/*"
  to = "https://prolific-caring-mali-staging.up.railway.app/summary/:splat"
  status = 200
  force = true
  query = {env = "staging"}

[[redirects]]
  from = "/summary/*"
  to = "https://prolific-caring-mali-production.up.railway.app/summary/:splat"
  status = 200
  force = true

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=300, s-maxage=300"

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Cache-Control = "public, max-age=300, s-maxage=300"
